<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#004CB3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Angel Dice">
    <title>Angel Dice</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/app.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8600791204816041"
        crossorigin="anonymous">
    </script>
</head>
<body>
    <canvas id="t1"></canvas>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-content" class="modal-content"></div>
            <div id="modal-buttons" class="modal-buttons"></div>
        </div>
    </div>

    <script src="js/game.js"></script>
    <script>
(function () {
  const SITE_ID = '8e7cef69-3f4f-4ec6-bef7-9fe7a1c3477f';
  const API    = 'https://angelgf.com.es/webanalyticsapi/api/visits';
  const KEY    = 'wa_visitor_id';
  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      siteId:           SITE_ID,
      visitorId:        localStorage.getItem(KEY),
      page:             window.location.href,
      referrer:         document.referrer || null,
      userAgent:        navigator.userAgent,
      language:         navigator.language,
      screenResolution: `${screen.width}x${screen.height}`
    })
  })
  .then(r => r.json())
  .then(data => localStorage.setItem(KEY, data.visitorId))
  .catch(() => {});
})();
</script>
</body>
</html>
